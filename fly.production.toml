app = 'mmmm-production'
primary_region = 'iad'

[deploy]
  # Through the direct connection, since migrations lock for the whole session.
  # Calls Prisma directly, because pnpm would first try to install the dev
  # dependencies the image leaves out
  release_command = "sh -c 'DATABASE_URL=\"$DIRECT_DATABASE_URL\" node_modules/.bin/prisma migrate deploy'"

[env]
  APP_ENV = 'production'
  EMAIL_TRANSPORT = 'resend'
  EMAIL_FROM = 'MMMM <noreply@send.mmmm.onl>'
  BETTER_AUTH_URL = 'https://mmmm.onl'

[http_service]
  internal_port = 3000
  force_https = true
  # A stopped machine forgets its rate limits and misses the daily job
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/healthz'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
