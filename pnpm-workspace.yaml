allowBuilds:
  '@prisma/engines': true
  esbuild: true
  # Its list is all the app reads, and the script fetches a newer one
  free-email-domains: false
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@tomer/eslint-config@6.0.0'
  - '@tomer/prettier-config@5.0.0'
overrides:
  # Security fixes their dependents' ranges exclude
  'effect@<3.22.1': ^3.22.1
  'katex@<0.18.2': ^0.18.2
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
shellEmulator: true
