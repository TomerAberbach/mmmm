name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each script runs on its own runner, so the slowest one, not the sum, sets
  # the wall time. `pnpm check` runs the same scripts
  check:
    name: ${{ matrix.name }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      # Like `npm-run-all -c`, so one failure doesn't hide the others
      fail-fast: false
      matrix:
        include:
          - name: Typecheck, lint, format, and knip
            script: check:static
          - name: Unit and browser tests
            script: check:test
            browser-and-database: true
          # The e2e tests keep 4 cores busy, so 2 runners finish them sooner
          - name: End-to-end tests, half 1
            script: test:e2e --shard=1/2
            browser-and-database: true
          - name: End-to-end tests, half 2
            script: test:e2e --shard=2/2
            browser-and-database: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - if: matrix.browser-and-database
        uses: ./.github/actions/setup-browser-and-database
      - run: pnpm ${{ matrix.script }}
