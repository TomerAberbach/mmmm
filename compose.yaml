services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: mmmm
      POSTGRES_PASSWORD: mmmm
      POSTGRES_DB: mmmm
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      # Postgres 18 keeps its data in a versioned folder under this path
      - postgres-18:/var/lib/postgresql

volumes:
  postgres-18:
